# CI + release for Yam.
#
# `test` runs on every PR and push (nix flake check -> ruff + format + pytest).
# On pushes to main, v* tags, and manual dispatch, the multi-arch image build
# runs *after* tests pass and publishes to Docker Hub. PRs run tests only.
#
# A daily schedule covers the case the source tree can't: YouTube breaks
# yt-dlp's extractor clients on its own schedule, so an image that worked last
# week starts 403ing without a line of yam changing. The schedule lives in
# ytdlp-rebuild.yml, which calls this file through `workflow_call`; inside a
# called workflow `github.event_name` is the caller's, so the `schedule` checks
# below still apply. The `ytdlp` job compares PyPI's current stable against the
# version labelled on the published :latest, and a scheduled build only runs
# when they differ -- so a quiet week costs one curl.
#
# The schedule is kept out of this file because GitHub disables any workflow
# with a `schedule` trigger after 60 days without repository activity, and a
# disabled workflow ignores pushes too. That stopped every push build from
# 2026-10-30 until the workflow was re-enabled by hand.
# The version it resolves is then pinned into the build, which keeps the label
# honest and stops the two architectures picking up different releases.
#
# The image builds linux/amd64 + linux/arm64 natively (no QEMU): each arch
# pushes an untagged, digest-only image and the manifest job stitches those
# digests into the tagged multi-arch manifests (:latest and any v* tag).
#
# Required repo secrets (for the publish jobs only):
#   DOCKERHUB_USERNAME  - your Docker Hub username (also the image namespace)
#   DOCKERHUB_TOKEN     - a Docker Hub access token (Account Settings -> Security)
name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      # Runs ruff, ruff format --check, and the pytest suite (see flake checks),
      # and builds the app package.
      - name: nix flake check
        run: nix flake check -L

  ytdlp:
    name: Resolve yt-dlp version
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    outputs:
      version: ${{ steps.check.outputs.version }}
      stale: ${{ steps.check.outputs.stale }}
    env:
      IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/yam
    steps:
      # Logged in for the registry read below: an anonymous manifest fetch shares
      # a per-IP pull limit with every other runner on the same egress.
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # `imagetools inspect` reads the config off the registry without pulling
      # layers. .Image on a manifest list is keyed by platform, so walk the JSON
      # for the label rather than guessing a path. A first run, or any image
      # predating the label, comes back empty and so counts as stale.
      # Neither lookup is allowed to fail the job. An unreachable PyPI leaves the
      # version empty, so a push still publishes -- just unpinned, labelled
      # "unknown", which the next scheduled run sees as stale and corrects. A
      # scheduled run in that state stops instead, since it learned nothing.
      - name: Compare PyPI against the published image
        id: check
        run: |
          set -uo pipefail
          latest=$(curl -fsSL --max-time 30 https://pypi.org/pypi/yt-dlp/json \
            | jq -r '.info.version // empty') || latest=""
          shipped=$(docker buildx imagetools inspect "$IMAGE:latest" --format '{{json .Image}}' \
            | jq -r 'first(.. | objects | .["io.yam.ytdlp.version"]? // empty) // empty') || shipped=""
          echo "PyPI stable: ${latest:-<unreachable>}"
          echo "Published:   ${shipped:-<unlabelled or unreachable>}"
          echo "version=$latest" >> "$GITHUB_OUTPUT"
          if [ -z "$latest" ] || [ "$latest" = "$shipped" ]; then
            echo "stale=false" >> "$GITHUB_OUTPUT"
            echo "Nothing to rebuild for; a scheduled run stops here."
          else
            echo "stale=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build image (${{ matrix.name }})
    needs: [test, ytdlp]
    # Scheduled runs build only when yt-dlp has actually moved; every other
    # trigger means the source tree changed, so build regardless.
    if: >-
      github.event_name != 'pull_request'
      && (github.event_name != 'schedule' || needs.ytdlp.outputs.stale == 'true')
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            runner: ubuntu-latest
            platform: linux/amd64
          - name: linux-arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    env:
      IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/yam
    steps:
      - uses: actions/checkout@v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      # OCI labels live in the per-arch image config, so they must be attached
      # here and not in the manifest job -- `imagetools create` stitches configs
      # that already exist and can't retrofit them. Only the labels output is
      # used; this job pushes by digest and names nothing, so its tags are
      # discarded (the manifest job derives the real ones).
      - name: Derive image labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-args: |
            YTDLP_VERSION=${{ needs.ytdlp.outputs.version }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest for manifest job
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest artifact
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.name }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  manifest:
    name: Push multi-arch manifest
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name != 'pull_request'
    env:
      IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/yam
    steps:
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Download digest artifacts
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.IMAGE }}@sha256:%s ' *)

      - name: Inspect pushed image
        run: docker buildx imagetools inspect "${IMAGE}:latest"
